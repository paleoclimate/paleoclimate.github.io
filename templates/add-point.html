<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCVS · Add points</title>
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: rgba(148, 163, 184, .45); --accent: #2f6fed; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background: #eef0f2;
  }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  h2 { font-size: 13px; margin: 22px 0 4px; letter-spacing: 0.08em; text-transform: uppercase; }
  h2.optional {
    font-size: 22px;
    font-weight: 750;
    letter-spacing: -0.02em;
    text-transform: none;
    margin: 32px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--ink);
  }
  .lead { color: var(--muted); font-size: 13px; margin: 0 0 18px; max-width: 40rem; }
  .section-note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .fields { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: start; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 650; }
  input, textarea, select {
    font: inherit;
    font-weight: 450;
    width: 18rem;
    max-width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  label.short input, label.short select { width: 9rem; }
  label.note textarea { width: 28rem; min-height: 72px; resize: vertical; }
  a { color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .queue {
    margin-top: 22px;
    padding: 14px 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .queue-label {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #pointCount { margin: 2px 0 8px; font-size: 28px; font-weight: 750; letter-spacing: -0.03em; }
  #pointList { margin: 0; padding-left: 18px; }
  #pointList:empty { display: none; }
  #pointList li { margin: 6px 0; font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .actions button {
    padding: 8px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  #downloadBtn { background: var(--ink); }
  #downloadBtn:disabled { background: #94a3b8; cursor: not-allowed; }
  button.remove {
    margin-left: 8px;
    padding: 2px 8px;
    border: 1px solid rgba(127, 29, 29, .35);
    border-radius: 6px;
    background: transparent;
    color: #7f1d1d;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <p><a href="index.html">Back to the atlas</a></p>
  <h1>Add points</h1>
  <p class="lead">Adicione quantos pontos desejar e depois exporte o geojson padronizado. Nenhum dado é atualizado para os mapas atuais.</p>
  <form id="pointForm">
    <h2>Required</h2>
    <p class="section-note">All fields in this section are required.</p>
    <div class="fields" id="essential"></div>
    <h2 class="optional">Optional Fields</h2>
    <div class="fields" id="optional"></div>
    <div class="queue">
      <p class="queue-label">Queued</p>
      <p id="pointCount" aria-live="polite">0 points added</p>
      <ul id="pointList"></ul>
    </div>
    <div class="actions">
      <button type="submit" id="addBtn">Add point</button>
      <button type="button" id="downloadBtn" disabled>Download GeoJSON</button>
    </div>
  </form>
</main>
<script>
var AGES = [65, 70, 75, 80, 85, 90, 95, 100, 105, 110, 115, 120, 125, 130, 135, 140, 145];
var RECONFILE = "Zahirovic_etal_2022_OptimisedMantleRef_and_NNRMantleRef.rot";
var STORAGE_KEY = "pcvs:added-points";
var ESSENTIAL = [
  {name: "Latitude", kind: "float", min: -90, max: 90, required: true, short: true, placeholder: "-12.34"},
  {name: "Longitude", kind: "float", min: -180, max: 180, required: true, short: true, placeholder: "-45.67"},
  {name: "TIME", kind: "age", required: true, short: true},
  {name: "Climate_Cl", kind: "climate", required: true, short: true},
  {name: "Country", kind: "text", required: true},
  {name: "Basin_Sub_", kind: "text", required: true},
  {name: "Formation", kind: "text", required: true},
  {name: "PlateID", kind: "int", short: true, required: true},
  {name: "REF(Authors, Year)", kind: "text", required: true}
];
var OPTIONAL = [
  {name: "Group", kind: "text"},
  {name: "Member", kind: "text"},
  {name: "Well name/ outcrop", kind: "text"},
  {name: "Dating evidence", kind: "note"},
  {name: "Lithology, structures, paleowind", kind: "note"},
  {name: "Paleoenvironment", kind: "note"},
  {name: "REF (Authors, Year)", kind: "text"},
  {name: "Fossil occurrences", kind: "note"},
  {name: "REF (Authors, Year)_1", kind: "text"},
  {name: "Geochemistry data", kind: "note"},
  {name: "REF (Authors, Year)_2", kind: "text"},
  {name: "Sediment-based climate inference (hot/cold, humid/semi-arid/desert)", kind: "text"},
  {name: "Fossil-based climate inference (hot/cold, humid/semi-arid/desert)", kind: "text"},
  {name: "Geochemistry-based climate inference  (hot/cold, humid/semi-arid/desert)", kind: "text"},
  {name: "Climate assignment leading evidence", kind: "note"}
];
var FLOAT = /^-?\d+(?:\.\d+)?$/;
var INTEGER = /^\d+$/;
var points = [];

function addOption(select, value, label, disabled) {
  var option = document.createElement("option");
  option.value = value;
  option.textContent = label;
  if (disabled) {
    option.disabled = true;
    option.selected = true;
    option.setAttribute("selected", "");
  }
  select.appendChild(option);
}

function makeField(spec) {
  var label = document.createElement("label");
  label.className = spec.short ? "short" : (spec.kind === "note" ? "note" : "");
  label.appendChild(document.createTextNode(spec.name));
  var field;
  if (spec.kind === "climate") {
    field = document.createElement("select");
    addOption(field, "", "Choose", true);
    addOption(field, "D", "Dry (D)");
    addOption(field, "S", "Semi-arid (S)");
    addOption(field, "H", "Humid (H)");
    field.selectedIndex = 0;
  } else if (spec.kind === "age") {
    field = document.createElement("select");
    if (spec.required) addOption(field, "", "Choose", true);
    else addOption(field, "", "—");
    AGES.forEach(function (age) { addOption(field, String(age), age + " Ma"); });
    field.selectedIndex = 0;
  } else if (spec.kind === "note") {
    field = document.createElement("textarea");
  } else {
    field = document.createElement("input");
    field.type = "text";
    field.autocomplete = "off";
    if (spec.placeholder) field.placeholder = spec.placeholder;
    if (spec.kind === "float") {
      field.inputMode = "decimal";
      field.pattern = "^-?\\d+(\\.\\d+)?$";
      field.title = "Use a dot as the decimal separator.";
      field.lang = "en";
    } else if (spec.kind === "int") {
      field.inputMode = "numeric";
      field.pattern = "\\d+";
      field.title = "Use a positive integer.";
    }
  }
  field.name = spec.name;
  if (spec.required) field.required = true;
  if (spec.kind === "float") {
    field.addEventListener("input", function () {
      var value = field.value.trim();
      if (!value) {
        field.setCustomValidity(spec.required ? "Required." : "");
        return;
      }
      if (!FLOAT.test(value)) {
        field.setCustomValidity("Use a dot as the decimal separator.");
        return;
      }
      var number = Number(value);
      if (number < spec.min || number > spec.max) {
        field.setCustomValidity(spec.name + " must be between " + spec.min + " and " + spec.max + ".");
        return;
      }
      field.setCustomValidity("");
    });
  } else if (spec.kind === "int") {
    field.addEventListener("input", function () {
      var value = field.value.trim();
      field.setCustomValidity(value && !INTEGER.test(value) ? "Use a positive integer." : "");
    });
  }
  label.appendChild(field);
  return label;
}

ESSENTIAL.forEach(function (spec) {
  document.getElementById("essential").appendChild(makeField(spec));
});
OPTIONAL.forEach(function (spec) {
  document.getElementById("optional").appendChild(makeField(spec));
});

function textOrNull(form, name) {
  var value = form.elements[name].value.trim();
  return value ? value : null;
}

function clearForm(form) {
  Array.prototype.forEach.call(form.elements, function (field) {
    if (!field.name) return;
    var tag = (field.tagName || "").toLowerCase();
    if (tag === "button") return;
    if (tag === "select") field.selectedIndex = 0;
    else field.value = "";
    if (field.setCustomValidity) field.setCustomValidity("");
  });
}

function stamp() {
  var now = new Date();
  function pad(number) { return String(number).padStart(2, "0"); }
  return now.getFullYear()
    + pad(now.getMonth() + 1)
    + pad(now.getDate())
    + "-"
    + pad(now.getHours())
    + pad(now.getMinutes())
    + pad(now.getSeconds());
}

function loadPoints() {
  try {
    var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function savePoints() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(points));
}

function renderQueue() {
  var count = points.length;
  var noun = count === 1 ? "point" : "points";
  document.getElementById("pointCount").textContent = count + " " + noun + " added";
  var list = document.getElementById("pointList");
  list.replaceChildren();
  points.forEach(function (feature, index) {
    var props = feature.properties;
    var item = document.createElement("li");
    item.appendChild(document.createTextNode(
      props.Latitude + ", " + props.Longitude + " · " + props.TIME + " Ma"
    ));
    var remove = document.createElement("button");
    remove.type = "button";
    remove.className = "remove";
    remove.textContent = "Remove";
    remove.addEventListener("click", function () {
      points.splice(index, 1);
      savePoints();
      renderQueue();
    });
    item.appendChild(remove);
    list.appendChild(item);
  });
  document.getElementById("downloadBtn").disabled = count === 0;
}

function featureFromForm(form) {
  var latitude = Number(form.elements.Latitude.value);
  var longitude = Number(form.elements.Longitude.value);
  var time = Number(form.elements.TIME.value);
  var plate = form.elements.PlateID.value.trim();
  return {
    type: "Feature",
    properties: {
      "ANCHOR": 0,
      "TIME": time,
      "FILE1": null,
      "RECONFILE1": RECONFILE,
      "ID": null,
      "Country": textOrNull(form, "Country"),
      "Basin_Sub_": textOrNull(form, "Basin_Sub_"),
      "Group": textOrNull(form, "Group"),
      "Formation": textOrNull(form, "Formation"),
      "Member": textOrNull(form, "Member"),
      "Well name/ outcrop": textOrNull(form, "Well name/ outcrop"),
      "Latitude": latitude,
      "Longitude": longitude,
      "Dating evidence": textOrNull(form, "Dating evidence"),
      "REF(Authors, Year)": textOrNull(form, "REF(Authors, Year)"),
      "Show_on_Ma": time,
      "Lithology, structures, paleowind": textOrNull(form, "Lithology, structures, paleowind"),
      "Paleoenvironment": textOrNull(form, "Paleoenvironment"),
      "REF (Authors, Year)": textOrNull(form, "REF (Authors, Year)"),
      "Fossil occurrences": textOrNull(form, "Fossil occurrences"),
      "REF (Authors, Year)_1": textOrNull(form, "REF (Authors, Year)_1"),
      "Geochemistry data": textOrNull(form, "Geochemistry data"),
      "REF (Authors, Year)_2": textOrNull(form, "REF (Authors, Year)_2"),
      "Sediment-based climate inference (hot/cold, humid/semi-arid/desert)": textOrNull(form, "Sediment-based climate inference (hot/cold, humid/semi-arid/desert)"),
      "Fossil-based climate inference (hot/cold, humid/semi-arid/desert)": textOrNull(form, "Fossil-based climate inference (hot/cold, humid/semi-arid/desert)"),
      "Geochemistry-based climate inference  (hot/cold, humid/semi-arid/desert)": textOrNull(form, "Geochemistry-based climate inference  (hot/cold, humid/semi-arid/desert)"),
      "Climate assignment leading evidence": textOrNull(form, "Climate assignment leading evidence"),
      "Climate_Cl": form.elements.Climate_Cl.value,
      "PlateID": plate ? Number(plate) : null
    },
    geometry: {type: "Point", coordinates: [longitude, latitude]}
  };
}

var form = document.getElementById("pointForm");
form.addEventListener("submit", function (event) {
  event.preventDefault();
  ["Latitude", "Longitude", "PlateID", "Country", "Basin_Sub_", "Formation", "REF(Authors, Year)"].forEach(function (name) {
    var field = form.elements[name];
    field.value = field.value.trim();
    field.dispatchEvent(new Event("input"));
  });
  if (!form.reportValidity()) return;
  points.push(featureFromForm(form));
  savePoints();
  renderQueue();
  clearForm(form);
});

document.getElementById("downloadBtn").addEventListener("click", function () {
  if (!points.length) return;
  var filename = "points-" + stamp() + ".geojson";
  var features = points.map(function (feature) {
    var copy = JSON.parse(JSON.stringify(feature));
    copy.properties.FILE1 = filename;
    copy.properties.Show_on_Ma = copy.properties.TIME;
    return copy;
  });
  var blob = new Blob(
    [JSON.stringify({type: "FeatureCollection", features: features}, null, 2)],
    {type: "application/geo+json"}
  );
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  points = [];
  localStorage.removeItem(STORAGE_KEY);
  renderQueue();
});

points = loadPoints();
renderQueue();
window.addEventListener("pageshow", function () {
  points = loadPoints();
  renderQueue();
});
</script>
</body>
</html>
