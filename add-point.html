<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>PCVS</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 220px;
                padding: 12vh 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #131c2e;
                color: #e8edf6;
                width: 220px;
                margin: 0 auto 100px;
                padding: 18px 16px;
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 12px;
                box-sizing: border-box;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                color: #e8edf6;
                font-size: 14px;
                outline: 0;
                padding: 8px 28px 8px 8px;
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #0a1120;
                width: 100%;
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                margin: 0 0 10px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                filter: invert(1);
                height: 16px;
                opacity: 0.75;
                padding: 8px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #0a1120;
                font-family: ui-sans-serif, system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-error {
                color: #fecaca;
                min-height: 1.2em;
                margin: 8px 0 0;
                font-size: 12px;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>

                const hashed = readSession(SESSION_HASH);
                if (hashed) {
                    const fromHash = await staticrypt.handleDecryptionOfPageFromHash(hashed, false);
                    if (fromHash.isSuccessful) return true;
                }
                const password = readSession(SESSION_PASSWORD);
                if (!password) return false;
                const fromPassword = await staticrypt.handleDecryptionOfPage(password, false);
                if (fromPassword.isSuccessful && fromPassword.hashedPassword) {
                    writeSession(SESSION_HASH, fromPassword.hashedPassword);
                    writeSession(SESSION_PASSWORD, "");
                }
                return fromPassword.isSuccessful;
            }

            window.onload = async function () {
                if (await unlockFromSession()) return;
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (isSuccessful) return;
                document.getElementById("staticrypt_loading").classList.add("hidden");
                document.getElementById("staticrypt_content").classList.remove("hidden");

                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value;
                const error = document.getElementById("staticrypt-error");
                if (error) error.textContent = "";
                writeSession(SESSION_PASSWORD, password);

                const { isSuccessful, hashedPassword } = await staticrypt.handleDecryptionOfPage(password, false);

                if (!isSuccessful) {
                    writeSession(SESSION_PASSWORD, "");
                    if (error) error.textContent = templateError;
                    return;

                if (hashedPassword) writeSession(SESSION_HASH, hashedPassword);
                writeSession(SESSION_PASSWORD, "");
